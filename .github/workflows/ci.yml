name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows support is experimental: agent hooks assume a POSIX shell.
    # narc:allow ci-failure-ignored reason="Windows job is advisory until the hooks support Windows shells"
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race ./... 2>&1 | tee test.log; then
            # Surface the failures as an annotation on the run.
            grep -E -- '--- FAIL|^FAIL|panic:|DATA RACE|\.go:[0-9]+:' test.log | head -60 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > fails.txt || true
            echo "::error title=go test failed on ${{ matrix.os }}::$(cat fails.txt)"
            exit 1
          fi
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

  dogfood:
    # narc checks its own pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -o narc ./cmd/narc
      - run: ./narc scan --base origin/${{ github.base_ref }} --format github
