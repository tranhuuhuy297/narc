version: 2
project_name: narc
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/narc
    binary: narc
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
brews:
  - repository:
      owner: tranhuuhuy297
      name: homebrew-tap
    homepage: https://github.com/tranhuuhuy297/narc
    description: "Catch AI coding agents cheating on your tests"
    license: MIT
    test: |
      system "#{bin}/narc", "version"
