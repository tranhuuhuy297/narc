version: 2
project_name: narc
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/narc
    binary: narc
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
# Homebrew: published to github.com/tranhuuhuy297/homebrew-tap when the
# HOMEBREW_TAP_GITHUB_TOKEN secret is set; skipped otherwise.
homebrew_casks:
  - name: narc
    repository:
      owner: tranhuuhuy297
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/tranhuuhuy297/narc
    description: "Catch AI coding agents cheating on your tests"
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/narc"]
          end
